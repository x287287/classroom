<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小豬消防隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/kit.css">
<style>
/* 遊戲固定使用自己的配色（不跟著系統深色模式）：暖色消防局風格，左側關卡地圖，右側大場景＋問題 */
:root{color-scheme:light;--ink:#2B2320;--muted2:#6B5E57;--paper:#FFF7EC;--card:#FFFFFF;--line2:#EADBC8;--fire:#D9481A;--fire2:#FF7A45;--ok:#1E8A5A;--no:#C8414B;--gold:#F2A900}
html,body{height:100%}
body{background:linear-gradient(180deg,#FFE7CF 0%,var(--paper) 40%);color:var(--ink);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(6px,1.2vh,14px);padding-block:clamp(8px,1.6vh,18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.top h1{font-size:clamp(1.6rem,3.6vh,2.5rem);color:var(--fire);display:flex;align-items:center;gap:.4rem}
.top h1 .badge{display:inline-grid;place-items:center;height:1.6em;padding:0 .5em;border-radius:999px;background:var(--fire);color:#fff;font-size:.6em;letter-spacing:.04em}
.top .sub{font-size:clamp(.8rem,1.6vh,1rem);color:var(--muted2)}
.top .stars{font-family:var(--font-display);font-size:clamp(1.15rem,2.8vh,1.7rem);color:#9A5B00;background:#FFF1C9;border:2px solid #F4D27A;border-radius:999px;padding:.1rem .9rem}
.top button{appearance:none;border:2px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem 1.1rem;min-height:2.9rem;cursor:pointer;font-family:var(--font-display);font-size:1rem}
.main{display:grid;grid-template-columns:clamp(210px,20vw,300px) minmax(0,1fr);gap:clamp(8px,1.4vw,18px);min-height:0}
.map{background:var(--card);border-radius:24px;padding:.8rem;display:flex;flex-direction:column;gap:.55rem;overflow:auto;border:2px solid var(--line2)}
.map h2{font-size:1.1rem;color:var(--muted2);text-align:center}
.lv{appearance:none;display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:center;border:3px solid var(--line2);background:#FFFCF7;color:var(--ink);border-radius:18px;padding:.5rem .7rem;text-align:left;cursor:pointer;min-height:4.4rem;font:inherit}
.lv .n{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;background:#E6DCD0;color:#8A7C70;font-family:var(--font-display);font-size:1.25rem}
.lv b{font-family:var(--font-display);font-weight:400;font-size:1.1rem;display:block;line-height:1.25;color:var(--ink)}
.lv small{color:var(--muted2);font-size:.82rem}
.lv small.st{color:var(--gold);letter-spacing:.12em;font-size:1rem}
.lv.open .n{background:var(--fire);color:#fff}
.lv.done .n{background:var(--ok);color:#fff}
.lv.cur{border-color:var(--fire);background:#FFE9DD;box-shadow:0 4px 0 #F2B9A0}
.lv:disabled{cursor:default;background:#F6F1EA;border-style:dashed}
.lv:disabled b{color:#9C8F84}
.lv:disabled .n::after{content:""}
.stage{background:var(--card);border-radius:24px;border:2px solid var(--line2);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(10px,1.6vw,24px);padding:clamp(12px,2vh,24px);min-height:0;overflow:auto}
.art{position:relative}
.art svg{display:block;width:100%;height:auto;border-radius:18px;border:3px solid var(--line2)}
.art .cap{position:absolute;left:12px;top:12px;background:var(--fire);color:#fff;font-family:var(--font-display);font-size:clamp(.95rem,2vh,1.2rem);padding:.15rem .8rem;border-radius:999px}
.story{font-size:clamp(1rem,2.2vh,1.2rem);color:var(--ink);background:#FFF4E2;border-left:5px solid var(--fire2);border-radius:0 12px 12px 0;padding:.5rem .8rem;margin:.3rem 0}
.lvname{font-size:clamp(.85rem,1.8vh,1rem);color:var(--muted2)}
.qq{font-family:var(--font-display);font-size:clamp(1.35rem,3.4vh,2.2rem);line-height:1.45;margin:.3rem 0 .6rem;color:var(--ink)}
.chs{display:grid;gap:clamp(7px,1.1vh,12px)}
.chs>button{appearance:none;-webkit-appearance:none;position:relative;border:3px solid #E2D3C1;background:#FFFCF7;color:var(--ink);border-radius:18px;padding:.6rem 3rem .6rem 1.1rem;min-height:clamp(3.3rem,7.2vh,4.8rem);font:inherit;font-size:clamp(1.05rem,2.3vh,1.4rem);font-weight:500;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;opacity:1}
.chs>button:disabled{color:var(--ink);opacity:1;cursor:default}
.chs>button:active:not(:disabled){transform:scale(.98);background:#FFF1E2}
.chs>button::after{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);font-size:1.5em;font-weight:700;line-height:1}
.chs>button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.chs>button.right:disabled{color:#fff}
.chs>button.right::after{content:"✓";color:#fff}
.chs>button.wrong{background:#fff;border-color:var(--no);border-style:dashed;color:var(--no)}
.chs>button.wrong:disabled{color:var(--no)}
.chs>button.wrong::after{content:"✗";color:var(--no)}
.chs>button[aria-pressed="true"]{background:#FFE1CF;border-color:var(--fire);color:var(--ink)}
.chs>button[aria-pressed="true"]::after{content:"✔";color:var(--fire)}
.chs>button[aria-pressed="true"].right{background:var(--ok);border-color:var(--ok);color:#fff}
.chs>button[aria-pressed="true"].right::after{content:"✓";color:#fff}
.chs .btn.fill{background:var(--fire);border-color:var(--fire);color:#fff;min-height:3.2rem;font-size:1.15rem;padding:0 1.6rem}
.fb{margin-top:.6rem}
.say.fb{background:#FFF4E2;border-color:#F0D4B0;color:var(--ink)}
.say.fb.good{background:#E3F5EB;border-color:var(--ok)}
.say.fb.good .t{color:var(--ok)}
.say.fb.bad{background:#FDE7E9;border-color:var(--no)}
.say.fb.bad .t{color:var(--no)}
.say.fb p{color:var(--ink)}
.say.fb .btn.fill{background:var(--fire);border-color:var(--fire);color:#fff;font-size:1.15rem;min-height:3.2rem;padding:0 1.6rem}
/* 排序題（KIT.order）在遊戲裡也用固定配色 */
.chs .k-order .slot{background:#FFFCF7;border-color:#E2D3C1;color:var(--ink)}
.chs .k-order .slot.filled{background:#E3F5EB;border-color:var(--ok)}
.chs .k-order .slot.filled b{color:var(--ok)}
.chs .k-order .slot.wrongpos{background:#FDE7E9;border-color:var(--no)}
.chs .k-order .slot .n{color:var(--muted2)}
.chs .k-order .pool button{background:#fff;border:3px solid var(--fire);color:var(--ink);font-family:var(--font-display);font-size:1.5rem;min-width:4.2rem;min-height:3.6rem;justify-content:center;text-align:center}
.chs .k-order .say{background:#FFF4E2;border-color:#F0D4B0;color:var(--ink)}
.chs .k-order .say.good{background:#E3F5EB;border-color:var(--ok)}
.chs .k-order .say.bad{background:#FDE7E9;border-color:var(--no)}
.chs .k-order .say p,.chs .k-order .muted{color:var(--muted2)}
.prog{display:flex;gap:.35rem;margin-bottom:.4rem}
.prog i{flex:1;height:.65rem;border-radius:99px;background:#EADFD2}
.prog i.on{background:var(--fire)}
.overlay{position:fixed;inset:0;background:rgba(60,30,10,.6);display:grid;place-items:center;z-index:50;padding:1rem}
.overlay[hidden]{display:none}
.cert{background:#FFFDF5;color:var(--ink);border:10px double #D9A441;border-radius:24px;padding:clamp(18px,3vh,40px);max-width:760px;width:100%;text-align:center;display:grid;gap:.8rem;max-height:94vh;overflow:auto}
.cert h2{font-size:clamp(2rem,5vh,3rem);color:var(--fire)}
.cert p{color:var(--ink)}
.cert .nm{font-family:var(--font-display);font-size:clamp(1.6rem,4vh,2.4rem);border-bottom:3px solid #D9A441;display:inline-block;padding:0 1rem;min-width:8em;color:var(--ink)}
.cert input{font-size:1.3rem;padding:.4rem .8rem;border-radius:12px;border:2px solid var(--line2);text-align:center;background:#fff;color:var(--ink)}
.cert .btn{background:#fff;border-color:var(--fire);color:var(--fire)}
.win{background:var(--card);color:var(--ink);border-radius:24px;padding:clamp(18px,3vh,34px);max-width:600px;width:100%;text-align:center;display:grid;gap:.8rem;border:4px solid var(--ok)}
.win h2{font-size:clamp(1.8rem,4.6vh,2.6rem);color:var(--ok)}
.win p{color:var(--ink)}
.win .st{font-size:3rem;color:var(--gold);letter-spacing:.2em}
.win .btn.fill{background:var(--fire);border-color:var(--fire);color:#fff;font-size:1.25rem;min-height:3.4rem;padding:0 2rem}
@media (max-width:900px),(max-height:560px){
  body{overflow:auto}.app{height:auto;min-height:100%}
  .main{grid-template-columns:minmax(0,1fr)}
  .map{flex-direction:row;overflow-x:auto}.map h2{display:none}.lv{min-width:12rem}
  .stage{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>

    {t:'c',q:'第一件事做什麼？',o:[{t:'大喊「失火了！」叫醒哥哥們',ok:1},{t:'蓋上棉被繼續睡',f:'警報響就是有危險，要馬上行動。'},{t:'先找存錢筒',f:'不要拿東西，每一秒都很重要。'}]},

var st={open:1,stars:[0,0,0,0,0],cur:0,step:0,miss:0};
function $(id){return document.getElementById(id)}
function drawMap(){var m=$('map');m.innerHTML='<h2>闖關地圖</h2>';LV.forEach(function(l,i){var b=document.createElement('button');b.type='button';b.className='lv'+(i<st.open?' open':'')+(st.stars[i]?' done':'')+(i===st.cur?' cur':'');b.disabled=i>=st.open;b.innerHTML='<span class="n">'+(i+1)+'</span><span><b>'+l.n+'</b>'+(st.stars[i]?'<small class="st">'+'★'.repeat(st.stars[i])+'☆'.repeat(3-st.stars[i])+'</small>':'<small>'+l.topic+'</small>')+'</span>';b.addEventListener('click',function(){begin(i)});m.appendChild(b)});var tot=st.stars.reduce(function(a,b){return a+b},0);$('totStars').textContent='★ '+tot+' / 15'}
function begin(i){st.cur=i;st.step=0;st.miss=0;drawMap();show()}
function art(step){var l=LV[st.cur],k=l.art,a=ART[k];var arg=step&&step.art2!=null?step.art2:step&&step.sm?1:undefined;$('art').innerHTML='<span class="cap">第 '+(st.cur+1)+' 關</span><svg viewBox="0 0 440 320" aria-hidden="true">'+a(arg)+'</svg>'}
function show(){
  var l=LV[st.cur],s=l.steps[st.step];art(s);
  var prog='<div class="prog">'+l.steps.map(function(_,i){return '<i class="'+(i<=st.step?'on':'')+'"></i>'}).join('')+'</div>';
  var qa=$('qa');qa.innerHTML=prog+'<div class="lvname">第 '+(st.cur+1)+' 關・'+l.n+'・第 '+(st.step+1)+' / '+l.steps.length+' 題</div>'+(st.step===0?'<p class="story">'+l.story+'</p>':'')+'<p class="qq">'+s.q+'</p><div class="chs" id="chs"></div><div class="say fb" id="fb" hidden></div>';
  var chs=$('chs'),fb=$('fb');
  if(s.t==='c'){KIT.shuffle(s.o).forEach(function(o){var b=document.createElement('button');b.type='button';b.textContent=o.t;b.addEventListener('click',function(){
    if(o.ok){b.classList.add('right');chs.querySelectorAll('button').forEach(function(z){z.disabled=true});good()}else{b.classList.add('wrong');b.disabled=true;st.miss++;fb.hidden=false;fb.className='say fb bad';fb.innerHTML='<div class="t">再想想</div><p>'+o.f+'</p>'}
  });chs.appendChild(b)})}
  else if(s.t==='m'){var sel={};KIT.shuffle(s.o).forEach(function(o){var b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed','false');b.textContent=o.t;b.addEventListener('click',function(){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on?'true':'false');if(on)sel[o.t]=o;else delete sel[o.t]});chs.appendChild(b)});
    var ok=document.createElement('button');ok.type='button';ok.className='btn fill';ok.textContent='確定';ok.style.justifySelf='start';ok.addEventListener('click',function(){var need=s.o.filter(function(o){return o.ok}).length,got=Object.keys(sel).filter(function(k){return sel[k].ok}).length,bad=Object.keys(sel).filter(function(k){return !sel[k].ok}).length;
      if(got===need&&!bad){chs.querySelectorAll('button').forEach(function(z){z.disabled=true;if(sel[z.textContent])z.classList.add('right')});good()}
      else{st.miss++;fb.hidden=false;fb.className='say fb bad';fb.innerHTML='<div class="t">還差一點</div><p>'+(bad?'有些選到的其實是<b>安全</b>的做法喔。':'')+(got<need?'還有 '+(need-got)+' 個危險的習慣沒有選到。':'')+'</p>'}});chs.appendChild(ok)}
  else if(s.t==='o'){var box=document.createElement('div');chs.appendChild(box);KIT.order(box,{steps:s.items.map(function(t){return {t:t}}),start:'第一步是什麼？',done:'順序正確！'});
    var watch=setInterval(function(){if(!document.body.contains(box)){clearInterval(watch);return}var filled=box.querySelectorAll('.slot.filled').length;var wrongNow=box.querySelector('.say.bad');if(wrongNow&&!box._m){box._m=1;st.miss++}if(!wrongNow)box._m=0;if(filled===s.items.length){clearInterval(watch);box.querySelectorAll('.btn').forEach(function(z){z.remove()});good()}},200)}
}
function good(){var l=LV[st.cur],fb=$('fb');fb.hidden=false;fb.className='say fb good';var last=st.step===l.steps.length-1;fb.innerHTML='<div class="t">答對了！</div>'+(last?'':'<button class="btn fill" type="button" id="goNext" style="margin-top:.4rem">繼續 →</button>');
  if(last){setTimeout(win,500)}else{$('goNext').addEventListener('click',function(){st.step++;show()});$('goNext').focus()}}
function win(){var s=Math.max(1,3-st.miss);if(s>st.stars[st.cur])st.stars[st.cur]=s;if(st.open<LV.length&&st.cur+1>=st.open)st.open=st.cur+2;drawMap();
  $('winT').textContent='第 '+(st.cur+1)+' 關過關！';$('winS').textContent='★'.repeat(s)+'☆'.repeat(3-s);$('winP').textContent=st.miss?'錯了 '+st.miss+' 次。可以再挑戰一次，拿到三顆星！':'全部一次答對，太厲害了！';
  $('bNextLv').textContent=st.cur===LV.length-1?'領取證書':'下一關 →';$('ovWin').hidden=false}
$('bNextLv').addEventListener('click',function(){$('ovWin').hidden=true;if(st.cur===LV.length-1){cert()}else begin(st.cur+1)});
function cert(){var tot=st.stars.reduce(function(a,b){return a+b},0);$('certStars').textContent='★ '+tot+' / 15';$('ovCert').hidden=false}
$('inClass').addEventListener('input',function(e){$('certName').textContent=e.target.value||'四年＿班'});
$('bCertClose').addEventListener('click',function(){$('ovCert').hidden=true});
$('bReset').addEventListener('click',function(){st={open:1,stars:[0,0,0,0,0],cur:0,step:0,miss:0};begin(0)});
$('bFs').addEventListener('click',function(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){})}catch(e){}});
document.addEventListener('fullscreenchange',function(){$('bFs').textContent=document.fullscreenElement?'離開全螢幕':'全螢幕'});
begin(0);
</script>
