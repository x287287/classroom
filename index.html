<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教室小書櫃</title>
<link rel="stylesheet" href="assets/fonts.css">
<script src="assets/sync.js"></script>
<style>
/* Layout: 方格簿 grid paper; a slim cover band, a toolbar (search + filters), then materials grouped by 單元 as index cards. */
:root{
  --paper:#F4F8F6;--grid:#D9E8E1;--ink:#1E3A34;--muted:#5C7770;--card:#FFFFFF;--line:#C9DBD3;
  --accent:#C4501E;--accent-ink:#FFFFFF;--leaf:#23784B;--sun:#F5B521;--sky:#2C6FAD;--plum:#9A5BC4;
  --display:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14201D;--grid:#1D2E2A;--ink:#E6F0EC;--muted:#9DB6AE;--card:#1B2925;--line:#2C433C;
  --accent:#FF8452;--accent-ink:#1A120E;--leaf:#5CC28A;--sun:#F7C94F;--sky:#79B4EA;--plum:#C597E6;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14201D;--grid:#1D2E2A;--ink:#E6F0EC;--muted:#9DB6AE;--card:#1B2925;--line:#2C433C;
  --accent:#FF8452;--accent-ink:#1A120E;--leaf:#5CC28A;--sun:#F7C94F;--sky:#79B4EA;--plum:#C597E6;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:grid;gap:28px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
.card h3 .tw{display:inline-block}
p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
button,input,select{font:inherit;color:var(--ink)}

.cover{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:22px 26px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;box-shadow:6px 6px 0 var(--leaf)}
.cover h1{font-size:clamp(30px,5vw,46px)}
.cover h1 .red{color:var(--accent)}
.cover .sub{color:var(--muted);font-size:15px}
.stats{display:flex;gap:20px;font-size:14px;color:var(--muted)}
.stats b{display:block;font-family:var(--display);font-size:28px;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}

.toolbar{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 240px;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.search:focus{border-color:var(--ink);outline:none}
select.sel{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font-size:16px;border:2px solid var(--ink);background:var(--card);padding:6px 16px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:44px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tab .n{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}

.units{display:grid;gap:16px}
.unit h2 .g{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);border:1px solid var(--line);background:var(--card);border-radius:6px;padding:0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px;margin-top:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;min-width:0;color:inherit;text-decoration:none}
.chip{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.06em;padding:2px 10px;border-radius:999px;color:var(--accent-ink)}
.chip.pdf{background:var(--accent)}.chip.slide{background:var(--sky)}.chip.video{background:var(--plum)}.chip.quiz{background:var(--leaf)}.chip.other{background:var(--muted)}
.lesson{font-size:13px;color:var(--muted)}
.card h3{font-size:19px;line-height:1.45;overflow-wrap:anywhere}
.card p{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.go{font-size:15px;font-weight:700;color:var(--accent);border-top:1px dashed var(--line);padding-top:10px}
.go.none{color:var(--muted);font-weight:400;font-size:13px}
.unit{background:var(--card);border:2px solid var(--ink);border-radius:18px;overflow:hidden}
.unit h2{margin:0;font-size:inherit}
.unit-toggle{appearance:none;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--card);border:0;padding:18px 20px;min-height:72px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.unit-toggle .ut{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.3}
.unit-toggle .cnt{font-size:14px;color:var(--muted);margin-left:auto}
.unit-toggle .chev{width:34px;height:34px;flex:none;border-radius:50%;background:var(--ink);position:relative;transition:transform .2s}
.unit-toggle .chev::before{content:"";position:absolute;left:9px;top:11px;width:11px;height:11px;border-right:3px solid var(--paper);border-bottom:3px solid var(--paper);transform:rotate(-45deg)}
.unit.open .unit-toggle .chev{transform:rotate(90deg)}
.unit.open .unit-toggle{border-bottom:2px dashed var(--line)}
.unit-body{padding:4px 20px 22px}
.allbtns{display:flex;gap:8px;flex-wrap:wrap}
.mini{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 16px;min-height:44px;cursor:pointer;font:inherit;font-size:15px}
@media (max-width:560px){.unit-toggle .ut{font-size:21px}.unit-toggle .cnt{margin-left:0;width:100%}.unit-body{padding:4px 14px 18px}}
.card{position:relative;padding:0;display:block}
.card-link{display:grid;grid-template-rows:auto auto 1fr auto auto;gap:10px;padding:16px;height:100%;color:inherit;text-decoration:none;border-radius:14px}
.card:hover{border-color:var(--ink)}
.card .meta{font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 8px;justify-self:start;font-variant-numeric:tabular-nums}
.acts{position:absolute;bottom:8px;right:10px;display:flex;gap:6px}
.pin-btn{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:4px 12px;min-height:44px;font:inherit;font-size:13px;cursor:pointer}
.pin-btn[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#1E3A34;font-weight:700}
.card.is-week{box-shadow:inset 0 4px 0 var(--sun)}
.recent.week{border-color:var(--sun);border-style:solid;background:color-mix(in srgb,var(--sun) 9%,var(--card))}
.recent.week .rc{background:var(--card)}
.week .rc .meta{font-size:12px;color:var(--muted)}
.week-btns{display:flex;gap:8px;flex-wrap:wrap}
.view-btns{display:flex;gap:8px;flex-wrap:wrap}
.wrap{zoom:var(--zoom,1)}
.done-btn{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:4px 12px;min-height:44px;font:inherit;font-size:13px;cursor:pointer}
.done-btn[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:700}
.card.is-done{background:color-mix(in srgb,var(--leaf) 7%,var(--card));border-color:color-mix(in srgb,var(--leaf) 45%,var(--line))}
.card.is-done h3{color:var(--muted)}
.mini[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
[hidden]{display:none!important}
.recent{background:var(--card);border:2px dashed var(--ink);border-radius:18px;padding:14px 18px;display:grid;gap:10px}
.recent-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.recent-h b{font-family:var(--display);font-size:20px}
.recent-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rc{display:grid;gap:4px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:inherit;text-decoration:none;min-height:44px;min-width:0}
.rc:hover{border-color:var(--ink)}
.rc .chip{justify-self:start}
.rc b{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.rc small{font-size:12px;color:var(--muted)}
.unit-toggle .prog{width:90px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.unit-toggle .prog i{display:block;height:100%;background:var(--leaf)}
.unit-toggle .pt{font-size:13px;color:var(--leaf);font-weight:700}
.lesson-group{margin-top:18px}
.lesson-h{font-family:var(--body);font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px;padding-bottom:6px;border-bottom:2px dashed var(--line)}
.lesson-h .n{font-size:12px;font-weight:500;color:var(--muted)}
.lesson-h.game{color:var(--accent)}
.chip.web{background:var(--leaf)}.chip.game{background:var(--accent)}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty b{font-family:var(--display);font-size:20px;color:var(--ink)}
footer{color:var(--muted);font-size:13px;text-align:center}

/* 老師登入、雲端同步、上傳教材 */
.mini.acct{display:inline-flex;align-items:center;gap:6px}
.mini.acct[data-s="ok"]{border-color:var(--leaf);color:var(--leaf);font-weight:700}
.mini.acct[data-s="offline"],.mini.acct[data-s="error"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.mini.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.edit-btn{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;min-height:44px;font:inherit;font-size:13px;cursor:pointer}
.up-tag{font-size:12px;color:var(--muted)}
.dlg{position:fixed;inset:0;z-index:2147483000;background:rgba(10,20,18,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.dlg[hidden]{display:none}
.dlg-box{background:var(--card);color:var(--ink);border-radius:18px;width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dlg-box.sm{width:min(420px,100%)}
.dlg-box h2{font-size:24px}
.dlg-box p.hint{font-size:14px;color:var(--muted);line-height:1.6}
.fld{display:grid;gap:6px;min-width:0}
.fld>span{font-size:14px;font-weight:700}
.fld>span small{font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:17px;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.fld-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 140px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.drop{display:grid;place-items:center;gap:6px;text-align:center;border:2.5px dashed var(--line);border-radius:14px;padding:22px 14px;cursor:pointer;background:var(--paper);min-height:120px}
.drop.over{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 10%,var(--paper))}
.drop b{font-size:18px}.drop small{color:var(--muted);font-size:13px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.dlg-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.dlg-acts .grow{margin-right:auto}
.btn{appearance:none;font:inherit;font-size:17px;font-weight:700;border-radius:999px;padding:8px 22px;min-height:48px;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.btn.pri{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.del{border-color:var(--accent);color:var(--accent)}
.btn.del.armed{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}
.msg{font-size:15px;font-weight:700;min-height:1.4em}
.msg.err{color:var(--accent)}.msg.ok{color:var(--leaf)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s}
.acct-info{display:grid;gap:4px;background:var(--paper);border-radius:12px;padding:12px 14px;font-size:15px}
.acct-info b{font-size:17px;overflow-wrap:anywhere}

@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease,border-color .15s}.card:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="cover">
    <div>
      <h1>我的<span class="red">教室小書櫃</span></h1>
      <p class="sub">講義、簡報、影片、練習題，全部收在這一格一格裡。</p>
    </div>
    <div class="stats">
      <span><b id="sTotal">0</b>份教材</span>
      <span><b id="sUnits">0</b>個單元</span>
    </div>
  </header>

  <section class="toolbar" aria-label="搜尋與篩選">
    <div class="row">
      <input class="search" id="q" type="search" placeholder="搜尋標題、單元或說明…" aria-label="搜尋">
      <select class="sel" id="gradeSel" aria-label="年級">
        <option value="all">全部年級</option>
        <option value="1">一年級</option><option value="2">二年級</option><option value="3">三年級</option>
        <option value="4">四年級</option><option value="5">五年級</option><option value="6">六年級</option>
      </select>
      <div class="view-btns"><button class="mini hot" type="button" id="addBtn" hidden>＋ 新增教材</button><button class="mini acct" type="button" id="acctBtn" data-s="off">☁ 老師登入</button><button class="mini" type="button" id="fontBtn">字：標準</button><button class="mini" type="button" id="fsBtn">⛶ 全螢幕</button></div>
    </div>
    <div class="tabs" role="group" aria-label="教材類型" id="tabs"></div>
    <div class="allbtns" id="allBtns"><button class="mini" type="button" id="expandAll">全部展開</button><button class="mini" type="button" id="collapseAll">全部收合</button><button class="mini" type="button" id="todoOnly" aria-pressed="false">只看還沒上過</button></div>
  </section>

  <section class="recent week" id="week" aria-label="本週要用" hidden></section>

  <section class="recent" id="recent" aria-label="最近打開" hidden></section>

  <main class="units" id="units"></main>

  <footer>教室小書櫃<span id="offline"></span></footer>
</div>

<!-- 老師登入 -->
<div class="dlg" id="loginDlg" hidden role="dialog" aria-modal="true" aria-labelledby="loginH">
  <form class="dlg-box sm" id="loginForm" novalidate>
    <h2 id="loginH">老師登入</h2>
    <p class="hint">登入後，「已上過」、「本週要用」、文字大小、抽籤設定等，會在所有登入的電腦同步；也可以上傳自己的教材。每台電腦只要登入一次。</p>
    <label class="fld"><span>Email</span><input id="lgEmail" type="email" autocomplete="username" required></label>
    <label class="fld"><span>密碼</span><input id="lgPw" type="password" autocomplete="current-password" required></label>
    <div class="msg err" id="lgMsg" aria-live="polite"></div>
    <div class="dlg-acts"><button class="btn" type="button" data-close>取消</button><button class="btn pri" type="submit" id="lgGo">登入</button></div>
  </form>
</div>

<!-- 帳號與同步 -->
<div class="dlg" id="acctDlg" hidden role="dialog" aria-modal="true" aria-labelledby="acctH">
  <div class="dlg-box sm">
    <h2 id="acctH">雲端同步</h2>
    <div class="acct-info"><span>登入帳號</span><b id="acEmail"></b><span id="acState"></span></div>
    <div class="dlg-acts" style="justify-content:flex-start"><button class="btn" type="button" id="acSync">立即同步</button></div>
    <form id="pwForm" class="fld" novalidate>
      <span>更改密碼 <small>（至少 8 個字，混合英文和數字）</small></span>
      <input id="pwNew" type="password" autocomplete="new-password" minlength="8" aria-label="新密碼">
      <div class="dlg-acts" style="justify-content:flex-start"><button class="btn" type="submit">更改密碼</button></div>
    </form>
    <div class="msg" id="acMsg" aria-live="polite"></div>
    <div class="dlg-acts"><button class="btn del grow" type="button" id="acOut">登出這台電腦</button><button class="btn pri" type="button" data-close>完成</button></div>
  </div>
</div>

<!-- 新增／編輯教材 -->
<div class="dlg" id="upDlg" hidden role="dialog" aria-modal="true" aria-labelledby="upH">
  <form class="dlg-box" id="upForm" novalidate>
    <h2 id="upH">新增教材</h2>
    <div class="seg" role="group" aria-label="教材來源"><button class="mini" type="button" data-src="file" aria-pressed="true">📄 上傳檔案</button><button class="mini" type="button" data-src="link" aria-pressed="false">🔗 網址連結</button></div>
    <label class="drop" id="upDrop">
      <input id="upFile" type="file" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.doc,.docx,.ppt,.pptx,.odt,.odp">
      <b id="upFileName">點這裡選擇檔案，或把檔案拖進來</b>
      <small>PDF、Word、PowerPoint、圖片，每個檔案 50 MB 以內</small>
    </label>
    <label class="fld" id="upLinkF" hidden><span>網址 <small>（YouTube、Google 簡報、其他網站）</small></span><input id="upUrl" type="url" inputmode="url" placeholder="https://"></label>
    <label class="fld"><span>標題</span><input id="upTitle" maxlength="120" required></label>
    <div class="fld-row">
      <label class="fld"><span>單元</span><input id="upUnit" list="unitList" autocomplete="off"></label>
      <label class="fld"><span>課次</span><input id="upLesson" list="lessonList" autocomplete="off" placeholder="例：第 2 課 酒精的真相"></label>
    </div>
    <div class="fld-row">
      <label class="fld"><span>類型</span><select id="upType"></select></label>
      <label class="fld"><span>年級</span><select id="upGrade"><option value="1">一年級</option><option value="2">二年級</option><option value="3">三年級</option><option value="4">四年級</option><option value="5">五年級</option><option value="6">六年級</option></select></label>
      <label class="fld"><span>課本頁碼</span><input id="upPages" placeholder="例：40–41"></label>
      <label class="fld"><span>建議分鐘</span><input id="upMins" type="number" min="1" max="200" inputmode="numeric"></label>
    </div>
    <label class="fld"><span>課本小標題 <small>（可不填）</small></span><input id="upTopic"></label>
    <label class="fld"><span>說明 <small>（可不填）</small></span><textarea id="upNote" maxlength="400"></textarea></label>
    <p class="hint">網站是公開的，請不要上傳學生姓名、照片或成績。</p>
    <div class="bar" id="upBar" hidden><i></i></div>
    <div class="msg" id="upMsg" aria-live="polite"></div>
    <div class="dlg-acts"><button class="btn del grow" type="button" id="upDel" hidden>刪除</button><button class="btn" type="button" data-close>取消</button><button class="btn pri" type="submit" id="upGo">儲存</button></div>
  </form>
</div>
<datalist id="unitList"></datalist><datalist id="lessonList"></datalist>

<script>
/* ============================================================
   教材清單：新增教材時，照下面的格式複製一段再修改。
   type：pdf 講義 / slide 簡報 / video 影片 / quiz 練習題 / other 其他
   url ：lessons/ 資料夾裡的檔案，或完整的網址（https://…）
   pages：對應的課本頁碼；mins：建議的上課時間（分鐘，依互動數量估算）
   ============================================================ */
const MATERIALS = [

const TYPES={all:"全部",web:"互動教材",slide:"動畫簡報",game:"統整遊戲",pdf:"講義",video:"影片",quiz:"練習題",other:"其他"};

/* 只有內容真的改變時才更新畫面，避免同步時整頁重畫、打斷正在點的動作 */
function setHTML(el,html){if(el.__html===html)return false;el.__html=html;el.innerHTML=html;return true;}
let curType="all", curGrade="all", query="";

function filtered(){
  const q=query.trim().toLowerCase();
  return MATERIALS.filter(i=>(!onlyTodo||!doneSet[i.url])&&(curGrade==="all"||String(i.grade)===curGrade)&&(!q||[i.title,i.unit,i.lesson,i.topic,i.note].join(" ").toLowerCase().includes(q)));
}
function card(i){
  const meta=[i.pages?`課本 p.${esc(i.pages)}`:"",i.mins?`約 ${i.mins} 分鐘`:""].filter(Boolean).join("・");
  const isDone=!!doneSet[i.url];
  const inner=`<span class="chip ${esc(i.type)}">${TYPES[i.type]||"其他"}</span>${i.topic?`<span class="lesson">課本小標題：${esc(i.topic)}</span>`:i.up?`<span class="up-tag">老師上傳</span>`:"<span></span>"}<div><h3>${esc(i.title).split("：").map((t,k,a)=>`<span class="tw">${t}${k<a.length-1?"：":""}</span>`).join("")}</h3>${i.note?`<p>${esc(i.note)}</p>`:""}</div>${meta?`<span class="meta">${meta}</span>`:"<span></span>"}`;
  const body=i.url
    ? `<a class="card-link" href="${esc(i.url)}" data-url="${esc(i.url)}">${inner}<span class="go">${i.type==="video"?"觀看":i.type==="game"?"開始玩":"打開"} →</span></a>`
    : `<div class="card-link">${inner}<span class="go none">連結待補</span></div>`;
  const isWeek=!!weekSet[i.url];
  return `<article class="card${isDone?" is-done":""}${isWeek?" is-week":""}">${body}${i.url?`<div class="acts"><button class="pin-btn" type="button" data-week="${esc(i.url)}" aria-pressed="${isWeek}" aria-label="${isWeek?"從本週要用移除":"加到本週要用"}：${esc(i.title)}">${isWeek?"★ 本週":"☆ 本週"}</button><button class="done-btn" type="button" data-done="${esc(i.url)}" aria-pressed="${isDone}" aria-label="${isDone?"取消已上過":"標記為已上過"}：${esc(i.title)}">${isDone?"✓ 已上過":"標記已上過"}</button>${i.up&&window.CLS&&CLS.isTeacher?`<button class="edit-btn" type="button" data-edit="${esc(i.up.id)}" aria-label="編輯：${esc(i.title)}">編輯</button>`:""}</div>`:""}</article>`;
}
/* 這台電腦的瀏覽器記住：已上過、最近打開（讀不到也沒關係） */
function load(k,d){try{return JSON.parse(localStorage.getItem(k)||"null")||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let doneSet=load("shelfDone",{}), recent=load("shelfRecent",[]), onlyTodo=false;
/* 本週要用：老師在卡片上按「☆ 本週」釘選，置頂顯示；要換週時按「清空本週」 */
let weekSet=load("shelfWeek",{});
function renderWeek(){
  const box=$("week"), items=MATERIALS.filter(m=>m.url&&weekSet[m.url]);
  box.hidden=!items.length;
  if(!items.length){setHTML(box,"");return;}
  const mins=items.reduce((a,m)=>a+(m.mins||0),0);
  if(!setHTML(box,`<div class="recent-h"><b>★ 本週要用</b><div class="week-btns"><span class="lesson" style="align-self:center">${items.length} 份${mins?`・約 ${mins} 分鐘`:""}</span><button class="mini" type="button" id="clearWeek">清空本週</button></div></div><div class="recent-list">${items.map(m=>`<a class="rc${doneSet[m.url]?" is-done":""}" href="${esc(m.url)}" data-url="${esc(m.url)}"><span class="chip ${esc(m.type)}">${TYPES[m.type]||""}</span><b>${doneSet[m.url]?"✓ ":""}${esc(m.title)}</b><small class="meta">${esc(((m.lesson||"").match(/^第\s*\d+\s*課/)||[m.type==="game"?"單元統整":(m.lesson||"")])[0])}${m.pages?`・課本 p.${esc(m.pages)}`:""}${m.mins?`・約 ${m.mins} 分鐘`:""}</small></a>`).join("")}</div>`))return;
  $("clearWeek").addEventListener("click",()=>{weekSet={};save("shelfWeek",weekSet);render();});
}
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return"剛剛";if(m<60)return m+" 分鐘前";const h=Math.round(m/60);if(h<24)return h+" 小時前";const d=Math.round(h/24);return d+" 天前"}
function renderRecent(){
  const box=$("recent"), items=recent.map(r=>({r,m:MATERIALS.find(x=>x.url===r.url)})).filter(x=>x.m).slice(0,4);
  box.hidden=!items.length;
  if(!items.length)return;
  if(!setHTML(box,`<div class="recent-h"><b>最近打開</b><button class="mini" type="button" id="clearRecent">清除紀錄</button></div><div class="recent-list">${items.map(({r,m})=>`<a class="rc" href="${esc(m.url)}" data-url="${esc(m.url)}"><span class="chip ${esc(m.type)}">${TYPES[m.type]||""}</span><b>${esc(m.title)}</b><small>${esc(m.unit.split(" ")[0].replace("康軒健康四上　",""))}・${ago(r.t)}</small></a>`).join("")}</div>`))return;
  $("clearRecent").addEventListener("click",()=>{recent=[];save("shelfRecent",recent);renderRecent();});
}
function render(){

  setHTML($("tabs"),Object.entries(TYPES).map(([k,v])=>{

    if(k!=="all"&&!MATERIALS.some(i=>i.type===k)) return "";
    return `<button class="tab" type="button" data-t="${k}" aria-pressed="${k===curType}">${v}<span class="n">${n}</span></button>`;
  }).join(""));
  $("sTotal").textContent=MATERIALS.length;
  $("sUnits").textContent=new Set(MATERIALS.map(i=>i.unit||"未分單元")).size;

  const list=base.filter(i=>curType==="all"||i.type===curType);
  if(!list.length){setHTML($("units"),`<div class="empty"><b>找不到符合的教材</b><span>換個關鍵字、年級或類型看看。</span></div>`);$("expandAll").hidden=$("collapseAll").hidden=true;renderRecent();renderWeek();return;}
  const units=new Map();
  list.forEach(i=>{
    const uk=(i.grade||0)+"|"+(i.unit||"未分單元");
    if(!units.has(uk))units.set(uk,new Map());

/* ============================================================
   老師上傳的教材（存在 Supabase，公開可讀；只有老師能新增／修改）
   清單也存一份在這台電腦（clsUploads），沒網路時照樣顯示。
   ============================================================ */
const BASE_N=MATERIALS.length;
const STORE_PUB=()=>CLS.url+"/storage/v1/object/public/materials/";
let uploads=load("clsUploads",[]);
const isImg=m=>/^image\//.test(m||""), isPdf=m=>m==="application/pdf";
function applyUploads(){
  MATERIALS.splice(BASE_N);
  uploads.slice().sort((a,b)=>a.sort-b.sort).forEach(r=>MATERIALS.push({
    unit:r.unit||"老師上傳的教材", lesson:r.lesson||"", topic:r.topic||"", title:r.title, type:r.type||"other",
    grade:r.grade||0, pages:r.pages||"", mins:r.mins||0, note:r.note||"", url:"lessons/view.html?id="+r.id, up:r
  }));
}
function fetchUploads(){
  if(!window.CLS)return Promise.resolve();
  return CLS.api("rest/v1/materials?select=*&order=sort.asc").then(r=>r.ok?r.json():Promise.reject(r)).then(rows=>{
    const changed=JSON.stringify(rows)!==JSON.stringify(uploads);
    uploads=rows; try{localStorage.setItem("clsUploads",JSON.stringify(rows))}catch(e){}
    if(changed){applyUploads();render();}
    cacheUploadFiles();
  }).catch(()=>{});
}
/* PDF 與圖片也存到這台電腦，網路斷線時一樣打得開 */
async function cacheUploadFiles(){
  if(!("caches" in window))return;
  try{
    const c=await caches.open("classroom-v1");
    for(const r of uploads){ if(r.kind!=="file"||!(isPdf(r.mime)||isImg(r.mime)))continue;
      const u=STORE_PUB()+r.path; if(!(await c.match(u))) await c.add(u).catch(()=>{}); }
  }catch(e){}
}
applyUploads();

const EXT_MIME={pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",
  doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",

function extOf(n){return (String(n).split(".").pop()||"").toLowerCase();}
function guessType(mime,url){
  if(url){ if(/youtu\.?be/.test(url))return"video"; if(/docs\.google\.com\/presentation|canva\.com/.test(url))return"slide"; if(/forms\.gle|docs\.google\.com\/forms|quizizz|kahoot|wordwall/.test(url))return"quiz"; return"other"; }
  if(/presentation|powerpoint/.test(mime))return"slide"; if(isImg(mime))return"other"; return"pdf";
}
function pickFile(f){
  if(!f)return;
  const mime=f.type&&EXT_MIME[extOf(f.name)]?EXT_MIME[extOf(f.name)]:(f.type||EXT_MIME[extOf(f.name)]||"");
  if(!Object.values(EXT_MIME).includes(mime)){msg("upMsg","這種檔案不能上傳。可以上傳 PDF、Word、PowerPoint 或圖片。","err");return;}
  if(f.size>MAX_MB*1024*1024){msg("upMsg",`檔案太大（${(f.size/1048576).toFixed(1)} MB），請小於 ${MAX_MB} MB。影片請先放到 YouTube 再貼網址。`,"err");return;}
  upFile={f,mime}; msg("upMsg","");
  $("upFileName").textContent="✓ "+f.name+"（"+(f.size/1048576).toFixed(1)+" MB）";
  if(!$("upTitle").value.trim())$("upTitle").value=f.name.replace(/\.[^.]+$/,"").replace(/[_]+/g," ").slice(0,120);
  if(!editing)$("upType").value=guessType(mime);
}

function uploadFile(file,mime,path,onProg){
  return CLS.token().then(t=>new Promise((res,rej)=>{
    if(!t){rej(new Error("登入已過期，請重新登入"));return;}
    const x=new XMLHttpRequest();
    x.open("POST",CLS.url+"/storage/v1/object/materials/"+path);
    x.setRequestHeader("apikey",CLS.key); x.setRequestHeader("Authorization","Bearer "+t);
    x.setRequestHeader("Content-Type",mime); x.setRequestHeader("x-upsert","false"); x.setRequestHeader("cache-control","max-age=31536000");
    x.upload.onprogress=e=>{if(e.lengthComputable)onProg(e.loaded/e.total);};
    x.onload=()=>x.status<300?res():rej(new Error("檔案上傳失敗（"+x.status+"）"));
    x.onerror=()=>rej(new Error("網路中斷，檔案沒有上傳成功"));
    x.send(file);
  }));
}

  if(!path)return Promise.resolve();

}

      : await CLS.api("rest/v1/materials",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(row)});
    if(!r.ok){ if(upFile&&row.path)removeFile(row.path); throw new Error("儲存失敗（"+r.status+"），請重新登入後再試"); }

(function(){
  if(!("serviceWorker" in navigator)||(location.protocol!=="https:"&&location.hostname!=="localhost"))return;
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  const el=$("offline");let tries=0;
  async function check(){
    try{
      const urls=MATERIALS.filter(m=>!m.up).map(m=>m.url).filter(Boolean);let n=0;
      for(const u of urls){if(await caches.match(u))n++;}
      el.textContent=n>=urls.length?"・已存到這台電腦，網路斷線也能用":"・正在存到這台電腦（"+n+" / "+urls.length+"）";
      if(n<urls.length&&++tries<40)setTimeout(check,3000);
    }catch(e){}
  }
  navigator.serviceWorker.ready.then(check).catch(()=>{});
})();
</script>
