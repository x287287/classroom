<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全班共戰：打倒大魔王</title>
<link rel="stylesheet" href="assets/fonts.css">
<!-- 全班共戰（lessons/u2-game-raid.html）的學生平板頁：raid.html?r=房號。
     先選座號加入（同一座號只能在一台平板），再跟著大螢幕作答；公布時顯示自己的對錯與說明。
     「各自搶攻」模式：用 raid_free_q 拿題目、raid_free_answer 作答（伺服器改題），答完馬上看對錯與說明，自動換下一題；答錯定身 3 秒。
     只呼叫 Supabase RPC：raid_join、raid_state、raid_answer、raid_free_q、raid_free_answer；不傳姓名。裝置代碼與想法牆共用 fbDevice，座號記在 raidSeat:<房號>。 -->
<link rel="stylesheet" href="assets/raid-student.css">
</head>
<body>
<div class="wrap">
  <h1 id="h1">⚔️ 全班共戰：打倒大魔王</h1>

  <section class="card" id="sCode" hidden>
    <h2>輸入房號</h2>
    <p class="muted">房號是老師大螢幕上的 6 位數字。</p>
    <div class="code"><input id="codeIn" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="房號"><button type="button" id="codeGo">加入</button></div>
    <div class="msg" id="codeMsg"></div>
  </section>

  <section class="card" id="sSeat" hidden>
    <h2>👋 選你的座號</h2>
    <p class="muted">大螢幕不會顯示名字。「各自搶攻」的排行榜只顯示座號和答對題數。</p>
    <p class="muted" style="font-weight:700;color:#7A1520">🔒 選好之後就不能自己換，請看清楚再按。選錯了要請老師輸入密碼。</p>
    <div class="msg" id="seatMsg" aria-live="polite"></div>
    <div class="seats" id="seats"></div>
  </section>

  <div id="sGame" hidden>
    <div class="me" id="me"></div>
    <div class="hud" style="margin-top:12px"><svg id="miniBoss" viewBox="0 0 300 200" aria-hidden="true"></svg><div style="flex:1"><div class="hp"><i id="hpFill"></i></div><div class="hpn" id="hpText"></div></div></div>
    <section class="card" id="body" style="margin-top:12px"></section>
  </div>
</div>
<script src="assets/raid-student.js"></script>
<script src="assets/avatar.js"></script>
<script src="assets/seatlock.js"></script>
<script src="assets/live.js"></script>
</body>
</html>
